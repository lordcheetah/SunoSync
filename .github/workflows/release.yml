name: Release

# Publishing on tag is what makes GitHub Releases the canonical binary source.
# The in-app updater queries this repository's releases API, so a release
# created here is what users are offered — nothing else can steer them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v3.0.1)"
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: check
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APP_VERSION=$(python -c "import sys; sys.path.insert(0,'.'); from core.version import APP_VERSION; print(APP_VERSION)")
          echo "Tag: $TAG / core.version.APP_VERSION: $APP_VERSION"
          if [ "$TAG" != "v$APP_VERSION" ]; then
            echo "::error::Tag $TAG does not match APP_VERSION $APP_VERSION in core/version.py."
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build release artifacts
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Test before shipping
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm SunoSync.spec

      - name: Build browser extensions
        run: python scripts/build_extension.py --zip

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash dist/SunoSync.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  SunoSync.exe" } |
            Out-File -FilePath dist/SHA256SUMS.txt -Encoding utf8
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SunoSync ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.txt
          # Published as a draft so the artifacts can be checked before anyone
          # can download them. Review the assets on the Releases page, then hit
          # Publish. The in-app updater ignores drafts, so nothing is offered to
          # users until you do.
          draft: true
          prerelease: false
          files: |
            dist/SunoSync.exe
            dist/SHA256SUMS.txt
            dist/sunosync-extension-chrome-*.zip
            dist/sunosync-extension-firefox-*.zip
