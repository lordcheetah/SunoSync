name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # A clean install from the pinned requirements is itself the test that
        # requirements.txt is complete and internally consistent.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Verify every import resolves
        # Catches dependencies that are imported but missing from
        # requirements.txt, which is how pywin32 went unnoticed.
        run: python -m compileall -q core services scripts main.py

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q

  build-extension:
    name: Build browser extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Chrome and Firefox variants
        run: python scripts/build_extension.py --zip

      - uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: dist/*.zip

  build-exe:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        # Runs on every push so spec drift (a moved asset, a renamed module) is
        # caught here rather than at release time.
        run: pyinstaller --noconfirm SunoSync.spec

      - name: Check the executable was produced
        run: |
          if (-not (Test-Path dist/SunoSync.exe)) { throw "dist/SunoSync.exe was not produced" }
          Get-Item dist/SunoSync.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: SunoSync-exe
          path: dist/SunoSync.exe
